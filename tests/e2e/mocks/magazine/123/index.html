<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Test Comic - Magazine Comic Viewer Helper</title>
    <style>
        body { margin: 0; padding: 0; background: #111; color: #eee; }
        #post-comic { display: flex; flexDirection: column; align-items: center; }
        .comic-page { display: block; margin: 20px auto; max-width: 100%; height: auto; border: 1px solid #333; }
        h1 { text-align: center; }
        #post-tag { text-align: center; margin: 20px; }
        #post-tag a { color: #aaa; margin: 0 10px; }
    </style>
</head>
<body>
    <h1>Test Comic Title</h1>
    <div id="post-tag">
        <a href="/artist/test-artist/">Test Artist</a>
        <a href="/genre/action/">Action</a>
    </div>

    <div id="post-comic">
        <img src="/images/page1.png" alt="Page 1" class="comic-page" width="800" height="1200">
        <img src="/images/page2.png" alt="Page 2" class="comic-page" width="800" height="1200">
        <img src="/images/page3.png" alt="Page 3" class="comic-page" width="800" height="1200">
        <img src="/images/page4.png" alt="Page 4" class="comic-page" width="800" height="1200">
        <img src="/images/page5.png" alt="Page 5" class="comic-page" width="800" height="1200">
    </div>

    <div class="post-list-image">
        <a href="/magazine/456/">
            <img src="/images/related.png" alt="Related">
            <span>Related Work 1</span>
        </a>
    </div>
</body>
</html>
